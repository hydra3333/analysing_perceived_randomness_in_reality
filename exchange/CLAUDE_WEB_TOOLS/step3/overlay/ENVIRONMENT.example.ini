; ENVIRONMENT.example.ini - the example of DEV's settings file (deployment design v0.12 section 1).
;
; WHOSE FILE IS THIS?
;   Every tree (DEV, QA, PROD) has its own settings file, named ENVIRONMENT.ini, in its own folder.
;   * DEV's file is made by hand, once: copy this example to ENVIRONMENT.ini beside it and correct the paths.
;     Git ignores ENVIRONMENT.ini, so no checkout or pull can replace it.
;   * QA's and PROD's files are NOT made from this example and NOT by hand. Init_Tree.bat writes each of them once,
;     in the new tree's own folder, from the [QA] or [PROD] section below. This file stays in DEV, unchanged.
;     What such a file looks like is shown at the end of this example.
;
; WHAT EACH SECTION IS
;   [environment]   The tree this file lies in. In DEV's file that is DEV. DEV has no backups, so there is no
;                   backup_root here.
;   [QA], [PROD]    Only in DEV's file. They say where the other two trees are, so that DEV's tools (Init_Tree,
;                   Install, Reinstall_Infra, Check_Tree) can find them. The section's name is the role, so there
;                   is no "role =" line in them. A tree named here need not exist yet: Init_Tree creates it.
;   [results]       The tree this tree copies the accepted draw results from: PROD. Leave it out until the PROD
;                   tree exists; without it the research job in DEV works with the results DEV already holds.
;
; THE RULES (every tool checks them and refuses if one is broken; Check_Tree.bat shows how the file is read)
;   * Every path is absolute and is the real path: no link, no junction, no substituted drive.
;   * DEV, QA and PROD are three separate folders, none inside another.
;   * A backup root is outside every tree, and QA's and PROD's backup roots are different folders.
;   * venv_dir is inside its own tree, so that every backup holds the Python environment.
;   * A backup root on the same disk as its tree is allowed, with a printed warning.
;
; Every path below is this PC's own (the owner's decisions of 23 November 2026). Correct them if a place changes.

[environment]
; This tree's role. In this file: DEV.
role = DEV
; The folder this file lies in. A tree that was copied or moved is refused until this says where it now is.
tree_root = E:\SOFTWARE-Win11\powerball\analysing_perceived_randomness_in_reality
; This tree's own Python environment. It must lie inside the tree.
venv_dir = E:\SOFTWARE-Win11\powerball\analysing_perceived_randomness_in_reality\.venv

[QA]
; Where the QA tree is, where its backups go, and its own Python environment.
tree_root = T:\a_p_r_i_r
backup_root = T:\a_p_r_i_r_backups\QA
venv_dir = T:\a_p_r_i_r\.venv

[PROD]
; Where the PROD tree is, where its backups go, and its own Python environment.
tree_root = G:\a_p_r_i_r
backup_root = T:\a_p_r_i_r_backups\PROD
venv_dir = G:\a_p_r_i_r\.venv

; Add this section, without the semicolons, once the PROD tree exists:
; [results]
; copy_from = G:\a_p_r_i_r

; ----------------------------------------------------------------------------------------------------------------
; FOR COMPARISON ONLY - do not copy: the file Init_Tree.bat writes in the QA tree, T:\a_p_r_i_r\ENVIRONMENT.ini.
; Its [environment] section is the QA tree itself, with QA's own backup root; it has no [QA] or [PROD] section.
;
;     [environment]
;     role = QA
;     tree_root = T:\a_p_r_i_r
;     backup_root = T:\a_p_r_i_r_backups\QA
;     venv_dir = T:\a_p_r_i_r\.venv
;     [results]
;     copy_from = G:\a_p_r_i_r
;
; PROD's own file is the same with role = PROD and PROD's paths, and has no [results] section: PROD's results come
; from the results updater.
