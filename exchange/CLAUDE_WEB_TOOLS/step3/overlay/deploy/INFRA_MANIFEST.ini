; deploy/INFRA_MANIFEST.ini - the infrastructure of the research system (specification v0.6 section 12.4).
;
; One line a file:  <path from the tree root, forward slashes, no spaces> = <class>
;   forecast   the file can change a forecast: the reader and the views, the engine that calls a method, the
;              readout, ranking and ties, and everything those files or a variant's files import
;   derived    it can change a score, a league report or an OV-1 line, but never a forecast
;   other      neither
; A file whose effect on forecasts cannot be ruled out is classed forecast. A test (tests/test_research_manifest.py)
; follows the imports and fails if a class is too weak. Nothing is infrastructure unless it is on this list.
; Not on it, and never installed outside DEV: documents, the exchange, tests, the old system's modules that the
; engine does not import, the settings files.
[files]
src/research/__init__.py = forecast
src/research/method_api.py = forecast
src/research/variant_folders.py = forecast
src/research/reader.py = forecast
src/research/readout.py = forecast
src/research/forecast_engine.py = forecast
src/methods/_common/__init__.py = forecast
src/methods/_common/canonical_encoding.py = forecast
src/methods/_common/contract_forecast.py = forecast
src/methods/_common/contract_records.py = forecast
src/methods/_common/contract_task.py = forecast
src/methods/_common/contract_vocab.py = forecast
src/methods/_common/game_profiles.py = forecast
src/research/code_identity.py = derived
src/research/game_state.py = derived
src/research/ov1_numeric.py = derived
src/research/ov1_ledger.py = derived
src/research/derived_check.py = derived
src/research/reports.py = derived
src/research/research_job.py = derived
src/research/withdraw.py = derived
src/research/variant_lists.py = derived
src/research/status_file.py = derived
src/research/scoring.py = derived
src/evaluation/__init__.py = derived
src/evaluation/divisions.py = derived
src/research/settings.py = derived
src/research/job_lock.py = derived
src/research/windows_text.py = derived
src/research/results_step.py = derived
src/research_command.py = other
Run_Research.bat = other
Run_Snapshot.bat = other
Verify_Tree.bat = other
Withdraw_Variant.bat = other
deploy/file_form.py = other
src/research/installed_files.py = derived
src/research/environment_marker.py = derived
src/research/process_rule.py = derived
src/research/launch_guard.py = derived
src/research/snapshot.py = derived
src/research/tree_checks.py = other
src/research/tree_verify.py = other
src/tree_checks_command.py = other

; The DEV-side install tool's own files (specification 12.4). They are NOT infrastructure: nothing here is ever
; installed into a QA or PROD tree. The infrastructure's readiness marker hashes them too, so that a tree is always
; installed by tools the marker names. The class is always "other".
[install_tool]
Make_Installable.bat = other
deploy/deploy_command.py = other
deploy/make_installable.py = other
deploy/install_readiness.py = other
deploy/install_import_check.py = other
Check_Tree.bat = other
deploy/check_tree.py = other
deploy/recovery_kit.py = other
deploy/restore_tool.py = other
deploy/kit/Restore.bat = other
deploy/kit/HOW_TO_RESTORE.txt = other
deploy/SUITE_MANIFEST.ini = other
deploy/suite_on_copy.py = other
