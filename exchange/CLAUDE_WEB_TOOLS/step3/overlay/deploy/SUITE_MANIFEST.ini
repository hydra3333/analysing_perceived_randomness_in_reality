# The test suite of the research system: what an install runs with the target tree's own Python, on a temporary
# copy of DEV's files (specification v0.6 section 12.3 item 3; deployment design v0.12 section 17, "the code round
# lists exactly what the suite needs from the repository").
#
# [tests]  the test modules of the suite, one a line, by the name of the file under tests/ without ".py". They are
#          the tests of the files on the infrastructure manifest (deploy/INFRA_MANIFEST.ini, both sections). Tests
#          that served only the first system are not listed and are not run by an install.
# What the temporary copy holds is not listed here, because the project already has one rule for it: every file
# under src/, deploy/ and tests/ and every file lying directly in the tree's root, as deploy/file_form.py walks
# them (Python's cache folders left out), except ENVIRONMENT.ini, which holds this PC's paths and is never copied.
[tests]
test_file_form
test_research_file_form
test_research_forecasts
test_research_identity
test_research_job
test_research_manifest
test_research_ov1_and_checks
test_research_ov1_numeric
test_research_records
test_trees_check_tree
test_trees_checks
test_trees_install_common
test_trees_installed_files
test_trees_launch_guard
test_trees_readiness
test_trees_restore
test_trees_settings
test_trees_snapshot
test_trees_suite
test_trees_verify
