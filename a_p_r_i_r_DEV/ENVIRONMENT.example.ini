; ENVIRONMENT.example.ini - the example of a tree's settings file (deployment design v0.12 section 1).
;
; In DEV: copy this file to ENVIRONMENT.ini beside it and put this PC's real paths in the copy. Git ignores
; ENVIRONMENT.ini, so no checkout or pull can replace it. In QA and PROD the file is written once by Init_Tree.bat
; and never edited afterwards.
;
; Every path is absolute. Every path below is an example.

[environment]
; This tree's role: DEV, QA or PROD.
role = DEV
; The folder this file lies in. A tree that was copied or moved is refused until this says where it now is.
tree_root = E:\SOFTWARE-Win11\powerball\analysing_perceived_randomness_in_reality
; This tree's own Python environment. It must lie inside the tree.
venv_dir = E:\SOFTWARE-Win11\powerball\analysing_perceived_randomness_in_reality\.venv

; The sections below are added when the QA and PROD trees are created (build step 3). Until then leave them out:
; with no [results] section the research job in DEV leaves its results step out and works with the results DEV
; already holds.
;
; [QA]
; tree_root = D:\TEST_BED
; backup_root = D:\TEST_BED_backups
; venv_dir = D:\TEST_BED\.venv
; [PROD]
; tree_root = G:\a_p_r_i_r
; backup_root = T:\a_p_r_i_r_backups
; venv_dir = G:\a_p_r_i_r\.venv
; [results]
; copy_from = G:\a_p_r_i_r
