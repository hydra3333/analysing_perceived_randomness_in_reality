; ENVIRONMENT.example.ini - the example of a tree's settings file (the simple scheme v0.2, section 3.1).
;
; The file has the same form in every tree; only the "role" line differs. Every path is the full real path.
;
; In DEV: copy this file to ENVIRONMENT.ini beside it. The paths below are the project owner's; on another PC,
; put that PC's paths in the copy. Git ignores ENVIRONMENT.ini, so no pull can replace it.
; In QA and PROD the file is written by Create_Tree.bat and is never copied from another tree.
;
; A command works on the folder its own launcher lies in, and first checks that folder: the role must be the
; ending of the folder's name (a_p_r_i_r_DEV, a_p_r_i_r_QA, a_p_r_i_r_PROD), and that role's tree_root must be
; that folder. No two trees share a folder, and no backup folder lies inside a tree.

[environment]
; This tree's role: DEV, QA or PROD.
role = DEV

[DEV]
tree_root = E:\SOFTWARE-Win11\powerball\analysing_perceived_randomness_in_reality\a_p_r_i_r_DEV
backup_root = T:\a_p_r_i_r_backups\DEV

[QA]
tree_root = T:\a_p_r_i_r_QA
backup_root = T:\a_p_r_i_r_backups\QA

[PROD]
tree_root = G:\a_p_r_i_r_PROD
backup_root = T:\a_p_r_i_r_backups\PROD
